services:
  postgres:
    image: postgres:16-alpine
    container_name: wealthify-postgres-dev
    env_file:
      - .development.env
    environment:
      # переопределяем — внутри docker-сети postgres слушает 5432, host
      # из .development.env (=localhost) тут неактуален
      POSTGRES_HOST: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Seed-дамп закоммичен в репо: db/seed.sql.gz (gzip-сжатый ~15 МБ).
      # postgres-образ нативно понимает .sql.gz — распакует и выполнит
      # через gunzip|psql при ПЕРВОМ старте (пустой volume postgres_data).
      # Содержит схему + спаршенный каталог криптоактивов, без чьих-либо
      # пользовательских данных. На повторных запусках init не запускается.
      - ./db/seed.sql.gz:/docker-entrypoint-initdb.d/01-seed.sql.gz:ro
    networks:
      - wealthify-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d wealthify"]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wealthify-rabbitmq-dev
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wealthify-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    container_name: wealthify-api-gateway-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .development.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - WEB_ORIGIN=http://localhost:3000
      - NODE_ENV=development
    ports:
      - "${PORT:-5001}:5001"
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    command: npm run start:gateway:dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network

  identity:
    container_name: wealthify-identity-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .development.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=development
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    command: npm run start:identity:dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network

  assets:
    container_name: wealthify-assets-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .development.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=development
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    command: npm run start:assets:dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network

  portfolio-core:
    container_name: wealthify-portfolio-core-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .development.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=development
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    command: npm run start:portfolio-core:dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network

  crypto-data-worker:
    container_name: wealthify-crypto-data-worker-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .development.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=development
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    # Сначала собираем worker-скрипты (bind-mount затирает dist из образа),
    # затем стартуем сам воркер в watch-режиме
    command: sh -c "npm run build:workers && npm run start:worker:dev"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network

  indexes-data-worker:
    container_name: wealthify-indexes-data-worker-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .development.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=development
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    command: npm run start:indexes:dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network

  stock-data-worker:
    container_name: wealthify-stock-data-worker-dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    env_file:
      - .development.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=development
    volumes:
      - .:/app
      - backend_node_modules:/app/node_modules
    command: npm run start:stocks:dev
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network

  # ── Frontend (Next.js dev) ──────────────────────────────────────────────
  # Контекст билда — соседняя папка wealthify-web/. Bind-mount даёт hot-reload;
  # анонимный том на node_modules защищает их от затирания bind-mount'ом
  # (на macOS host-овые node_modules могут быть несовместимы с linux-билдом).
  # NEXT_PUBLIC_API_URL — куда ходит браузер (хост:порт),
  # INTERNAL_API_URL  — куда ходит сам Next-server (внутр. имя docker-сети).
  web:
    container_name: wealthify-web-dev
    build:
      context: ../wealthify-web
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:5001
      - INTERNAL_API_URL=http://api-gateway:5001
      - NEXT_TELEMETRY_DISABLED=1
      # Polling нужен для надёжного file-watching через bind-mount на macOS
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3000:3000"
    volumes:
      - ../wealthify-web:/app
      - web_node_modules:/app/node_modules
      - web_next_cache:/app/.next
    command: npm run dev
    depends_on:
      - api-gateway
    networks:
      - wealthify-network

volumes:
  postgres_data:
  rabbitmq_data:
  backend_node_modules:
  web_node_modules:
  web_next_cache:

networks:
  wealthify-network:
    driver: bridge
