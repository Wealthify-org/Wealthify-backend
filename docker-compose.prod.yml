services:
  postgres:
    image: postgres:16-alpine
    container_name: wealthify-postgres-prod
    env_file:
      - .production.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - wealthify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: wealthify-rabbitmq-prod
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - wealthify-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    container_name: wealthify-api-gateway-prod
    build:
      context: .
      dockerfile: ./apps/api-gateway/Dockerfile
      target: production
    env_file:
      - .production.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production
    ports:
      - "${PORT:-5001}:5001"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network
    restart: unless-stopped

  identity:
    container_name: wealthify-identity-prod
    build:
      context: .
      dockerfile: ./apps/identity/Dockerfile
      target: production
    env_file:
      - .production.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network
    restart: unless-stopped

  assets:
    container_name: wealthify-assets-prod
    build:
      context: .
      dockerfile: ./apps/assets/Dockerfile
      target: production
    env_file:
      - .production.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network
    restart: unless-stopped

  portfolio-core:
    container_name: wealthify-portfolio-core-prod
    build:
      context: .
      dockerfile: ./apps/portfolio-core/Dockerfile
      target: production
    env_file:
      - .production.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network
    restart: unless-stopped

  crypto-data-worker:
    container_name: wealthify-crypto-data-worker-prod
    build:
      context: .
      dockerfile: ./apps/crypto-data-worker/Dockerfile
      target: production
    env_file:
      - .production.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production
    volumes:
      - logos_storage:/app/storage/logos
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network
    restart: unless-stopped

  indexes-data-worker:
    container_name: wealthify-indexes-data-worker-prod
    build:
      context: .
      dockerfile: ./apps/indexes-data-worker/Dockerfile
      target: production
    env_file:
      - .production.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network
    restart: unless-stopped

  stock-data-worker:
    container_name: wealthify-stock-data-worker-prod
    build:
      context: .
      dockerfile: ./apps/stock-data-worker/Dockerfile
      target: production
    env_file:
      - .production.env
    environment:
      - POSTGRES_HOST=postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - wealthify-network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  logos_storage:

networks:
  wealthify-network:
    driver: bridge
